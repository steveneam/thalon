# B6.7 (ADR 0007): builds ghcr.io/steveneam/thalon-web from Dockerfile.web on
# every main push — the ONLY place this image is ever built (no-Docker rule on
# the dev machine). The box's platform pulls by digest via its per-project
# GHCR pull credential (tenant handoff pack). NEXT_PUBLIC_SITE_URL is baked
# at build time by design (Next inlines NEXT_PUBLIC_*).
name: web-image

on:
  push:
    branches: [main]
    # Docs-only pushes (session wraps) don't touch the image — skip the
    # runner entirely. Root-level *.md ONLY: proprietary/prompts/*.md ships
    # IN the image and must keep triggering builds.
    paths-ignore:
      - "docs/**"
      - "agent_handoff/**"
      - "*.md"
      # Template-portfolio sites ship in their OWN image (templates-image.yml);
      # nothing under templates/ reaches the web runtime image (only
      # proprietary/prompts + profiles are copied — keep THOSE triggering).
      - "proprietary/templates/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: web-image # serialize; a stale queued build is dropped

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build to the local daemon first: the smoke gate below must pass
      # before anything reaches GHCR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://thalon.org
          tags: ghcr.io/steveneam/thalon-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke gate: boot the image on an EMPTY anonymous volume (a fresh
      # deploy's exact state) and require every engine-touching public route
      # to render. Pins the standalone-trace class of failure the in-build
      # PGlite check cannot see: the 2026-07-13 staging incident shipped an
      # image whose /blog, feeds, sitemap and llms.txt all 500'd at module
      # load (playwright-core traced without browsers.json) while health
      # stayed green. See packages/engine/src/__tests__/barrel-purity.test.ts
      # for the unit-level half of this ratchet.
      - name: smoke — engine-touching routes render on an empty volume
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e WORKSPACE_BASIC_AUTH=smoke:smoke \
            ghcr.io/steveneam/thalon-web:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          fail=0
          for path in /api/health /blog /blog/rss.xml /sitemap.xml /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo '::error::smoke gate failed — container logs follow'
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke
      # Push only after the gate: pure cache-hit rebuild, so this is fast
      # and byte-identical, with provenance attached as before.
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://thalon.org
          tags: |
            ghcr.io/steveneam/thalon-web:latest
            ghcr.io/steveneam/thalon-web:${{ github.sha }}
          cache-from: type=gha
      # Auto-deploy to staging (founder direction 2026-07-13; recipe proven
      # live by swordfish — agent_handoff/FROM-SWORDFISH-AUTODEPLOY-2026-07-13.md):
      # pin the exact sha@digest via the per-app scoped credential, deploy,
      # poll to done|error. update+deploy is deliberate — the deploy-webhook
      # only re-pulls the configured tag and saveDockerProvider can clobber
      # the stored GHCR pull credential; never switch to either.
      - name: deploy — pin sha@digest on staging via the scoped Dokploy key
        env:
          API: ${{ vars.DOKPLOY_API_BASE }}
          KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP: ${{ secrets.DOKPLOY_APP_ID }}
          IMAGE: ghcr.io/steveneam/thalon-web:${{ github.sha }}@${{ steps.push.outputs.digest }}
        run: |
          curl -fsS -X POST "$API/application.update" \
            -H "x-api-key: $KEY" -H 'content-type: application/json' \
            -d "{\"applicationId\":\"$APP\",\"dockerImage\":\"$IMAGE\"}" > /dev/null
          curl -fsS -X POST "$API/application.deploy" \
            -H "x-api-key: $KEY" -H 'content-type: application/json' \
            -d "{\"applicationId\":\"$APP\",\"title\":\"main ${GITHUB_SHA::7}\"}" > /dev/null
          for i in $(seq 1 60); do
            status=$(curl -fsS "$API/application.one?applicationId=$APP" \
              -H "x-api-key: $KEY" | jq -r .applicationStatus)
            echo "applicationStatus: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo '::error::staging deploy errored — roll back = rerun with the previous sha@digest'; exit 1 ;;
            esac
            sleep 5
          done
          echo '::error::staging deploy did not settle in 5 minutes'
          exit 1
      # Post-deploy probe THROUGH the edge: same five routes as the
      # empty-volume gate — the class the pre-2026-07-13 smoke pass missed.
      # At launch the edge auth drops and STAGING_EDGE_AUTH rotates; probe
      # 401s right after a launch announcement are expected until this step
      # is updated.
      - name: probe — staging serves the five routes through the edge
        env:
          HOST: ${{ vars.STAGING_HOST }}
          EDGE: ${{ secrets.STAGING_EDGE_AUTH }}
        run: |
          for i in $(seq 1 12); do
            curl -fsS -u "$EDGE" "https://$HOST/api/health" > /dev/null 2>&1 && break
            sleep 5
          done
          fail=0
          for path in /api/health /blog /blog/rss.xml /sitemap.xml /llms.txt; do
            code=$(curl -s -u "$EDGE" -o /dev/null -w '%{http_code}' "https://$HOST$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo '::error::staging probe failed after deploy'; exit 1; }
