name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-grep-guard:
    name: ci-grep-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand-cleanliness guard (zero forbidden tokens in tracked files)
        shell: pwsh
        run: ./scripts/ci-grep-guard.ps1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
