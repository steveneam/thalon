name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

# CI diet (founder-approved 2026-07-17, net-positive-speedups directive):
# superseded PR runs are cancelled — the newest commit's run is the one that
# matters. main is NEVER cancelled: every main commit keeps its full stamp.
concurrency:
  group: ci-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # CI diet, part 2: docs-only changes skip the heavy jobs. QUALITY-PINNED
  # CONSERVATIVE: only `docs/**`, `agent_handoff/**`, and ROOT-level *.md
  # count as docs — everything else (including proprietary/** prompts, which
  # are hash-pinned runtime data) is code and runs the full matrix. Any
  # doubt (unknown base, force push, empty diff) fails safe to code=true.
  changes:
    name: changes (docs-only detector)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            RANGE="$BASE...HEAD"
          else
            BASE="${{ github.event.before }}"
            RANGE="$BASE..HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "unknown base — failing safe to code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$RANGE")"
          echo "changed files:"; echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "empty diff — failing safe to code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -qvE '^(docs/|agent_handoff/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only — heavy jobs skip (guard already ran)"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The suite is the CI long pole (~1050 tests, a fresh embedded Postgres
  # per db test file), so it runs SHARDED (founder direction 2026-07-08:
  # sharding saves wall-clock and vitest partitions by file, so it is
  # exactly as strict). Typecheck + lint run once in their own lane; the
  # aggregate job below keeps the REQUIRED-CHECK NAME `test` stable across
  # the split (branch protection never has to change).
  checks:
    name: checks (typecheck + lint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # B2.2 ratchet: lint gates the PR, not the lead's merge pass (B1.4
      # lesson — lane lint findings surfaced only at merge). Root eslint
      # covers packages/proprietary/eval; the chained web lint covers apps/web.
      - run: npm run lint

  test-shards:
    name: test (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # every shard reports — a red run shows ALL failures, not the first shard's
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3

  test:
    name: test
    needs: [changes, checks, test-shards]
    if: always() # the gate must REPORT on failure, not skip (a skipped required check blocks nothing)
    runs-on: ubuntu-latest
    steps:
      - name: Every shard + the checks lane succeeded (or the diff was provably docs-only)
        run: |
          if test "${{ needs.changes.outputs.code }}" = "false"; then
            test "${{ needs.checks.result }}" = "skipped"
            test "${{ needs.test-shards.result }}" = "skipped"
          else
            test "${{ needs.checks.result }}" = "success"
            test "${{ needs.test-shards.result }}" = "success"
          fi

  # B6.7 (ADR 0007): the production build must stay green — Dockerfile.web
  # runs exactly this build, so a PR that breaks `next build` (or silently
  # drops the standalone trace / PGlite WASM assets) fails HERE, not at the
  # image build on main. Keyless by design: NEXT_PUBLIC_SITE_URL falls back
  # to the RFC-2606 placeholder and no data dir is touched.
  web-build:
    name: web-build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @thalon/web
      - name: Standalone trace sanity (the Dockerfile.web executable check, mirrored)
        run: |
          test -f apps/web/.next/standalone/apps/web/server.js
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/pglite.wasm
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/pglite.data
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/vector.tar.gz

  # The Sprint-1 ship gate (charter B1.5, ratified decision 5): the KEYLESS
  # deterministic eval suite must be green to merge. The eval vitest project
  # already rides `npm test` above; this job arms the remaining keyless
  # harnesses (DeepEval denylist metric, promptfoo echo smoke). Model-graded
  # evals (golden:g3) cost tokens and stay OUT of CI by invariant — run
  # manually per eval/README.md.
  eval-gate:
    name: eval-gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run -w @thalon/eval promptfoo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/deepeval/requirements.txt
      - run: pip install -r eval/deepeval/requirements.txt
      - run: python -m pytest eval/deepeval

  infra-tests:
    name: infra-tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
