name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-grep-guard:
    name: ci-grep-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand-cleanliness guard (zero forbidden tokens in tracked files)
        shell: pwsh
        run: ./scripts/ci-grep-guard.ps1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # B2.2 ratchet: lint gates the PR, not the lead's merge pass (B1.4
      # lesson — lane lint findings surfaced only at merge). Root eslint
      # covers packages/proprietary/eval; the chained web lint covers apps/web.
      - run: npm run lint
      - run: npm test

  # B6.7 (ADR 0007): the production build must stay green — Dockerfile.web
  # runs exactly this build, so a PR that breaks `next build` (or silently
  # drops the standalone trace / PGlite WASM assets) fails HERE, not at the
  # image build on main. Keyless by design: NEXT_PUBLIC_SITE_URL falls back
  # to the RFC-2606 placeholder and no data dir is touched.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @thalon/web
      - name: Standalone trace sanity (the Dockerfile.web executable check, mirrored)
        run: |
          test -f apps/web/.next/standalone/apps/web/server.js
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/pglite.wasm
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/pglite.data
          test -f apps/web/.next/standalone/node_modules/@electric-sql/pglite/dist/vector.tar.gz

  # The Sprint-1 ship gate (charter B1.5, ratified decision 5): the KEYLESS
  # deterministic eval suite must be green to merge. The eval vitest project
  # already rides `npm test` above; this job arms the remaining keyless
  # harnesses (DeepEval denylist metric, promptfoo echo smoke). Model-graded
  # evals (golden:g3) cost tokens and stay OUT of CI by invariant — run
  # manually per eval/README.md.
  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run -w @thalon/eval promptfoo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/deepeval/requirements.txt
      - run: pip install -r eval/deepeval/requirements.txt
      - run: python -m pytest eval/deepeval

  infra-tests:
    name: infra-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
