# Deploys infra/** from main via the GitHub OIDC role — no static keys.
# Activated at the B0.5 merge checkpoint (authored in infra/github-workflow/
# as an .example by Lane B). Prerequisites, all done 2026-07-03:
#   1. ThalonGithubOidc stack deployed once by a human (see infra/README.md)
#   2. Repo variable AWS_DEPLOY_ROLE_ARN set to the stack's DeployRoleArn output
#   3. cdk bootstrap completed in the sub-account (ap-southeast-2)

name: deploy-infra

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read

concurrency: deploy-infra # serialize deploys; a stale queued run is dropped

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: npx aws-cdk@2 diff
      - run: npx aws-cdk@2 deploy --all --require-approval never
