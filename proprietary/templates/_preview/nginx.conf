# Preview-gallery server config (scaffolding contract: ../README.md).
# Docroot is built from sites/<slug>/ ONLY plus the neutral root index —
# the factory method docs never reach this host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pages revalidate quickly; derived assets are content-stable per deploy.
    add_header Cache-Control "public, max-age=300";
    location ~* \.(webp|avif|png|jpg|svg|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
}
